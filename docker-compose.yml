# ============================================================================
# RAG stack (Phase 1: MCP-only) - separate repo, attached to the main stack
# via the external "ai-net" network created by the llama.cpp repo.
#
#   make init && make up
#
#   embedder  - llama.cpp --embeddings on CPU (bge-m3), never touches the GPU
#   qdrant    - vector DB, own volume, keyed even on the internal network
#   rag-core  - FastAPI + MCP: /mcp for opencode, /ingest, /health, /metrics
#
#   Networks: rag-net (internal: true) for embedder/qdrant, plus ai-net
#   (external) so rag-core reaches llama-server by service alias in Phase 2.
#   Only rag-core publishes a port, bound to 127.0.0.1 (Phase 1).
#
#   Secrets live in secrets/ (gitignored), generated by `make init`.
# ============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # CPU embedder: same pinned llama.cpp image as the main repo, -ngl 0.
  # No API key: it is unreachable from host and internet (rag-net is internal).
  # ---------------------------------------------------------------------------
  embedder:
    image: ghcr.io/ggml-org/llama.cpp@sha256:6da04cde049c6410fd93a45810dc2072ea8c8041ad9fc091f48e3064e322fb83
    container_name: rag-embedder
    restart: unless-stopped
    networks:
      - rag-net
    volumes:
      - "${EMBED_MODEL_FILE:?set EMBED_MODEL_FILE in .env}:/model/bge-m3.gguf:ro"
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8081"
      - --metrics
      - --embeddings
      - -m
      - "/model/bge-m3.gguf"
      # CPU only: VRAM is held by the main model. Half the 12 cores.
      - -ngl
      - "0"
      - -t
      - "6"
      # Context >= chunk size; in --embeddings mode each input must fit in ONE
      # physical batch, so -b must cover the largest chunk (~620 tokens max at
      # CHUNK_CHARS=2000) - 2048 leaves headroom. -ub must be >= -b.
      - -c
      - "8192"
      - -b
      - "2048"
      - -ub
      - "4096"
    # /health is public in this build. start_period covers the ~1.1 GB Q8 load.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Qdrant v1.20.2. Keyed (QDRANT__SERVICE__API_KEY) even though it sits on
  # the internal network; the key is mounted as a secret file.
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant@sha256:d277592721d2e3b73f9b797b53cf05e6a5bb2134f6d13fdbda4ca51782afbcac
    container_name: rag-qdrant
    restart: unless-stopped
    networks:
      - rag-net
    volumes:
      - qdrant-data:/qdrant/storage
      - ./secrets/qdrant_api_key:/qdrant/.api_key:ro
    environment:
      - QDRANT__SERVICE__API_KEY_FILE=/qdrant/.api_key
    # The qdrant image ships neither curl nor wget (and its /bin/sh has no
    # /dev/tcp), so use the perl from perl-base for a TCP-connect check:
    # the API is not usable until the port answers.
    healthcheck:
      test:
        - CMD
        - perl
        - -MIO::Socket::INET
        - -e
        - 'exit(!IO::Socket::INET->new(PeerAddr => "127.0.0.1:6333", Timeout => 3));'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # rag-core: one Python process serving MCP (/mcp), ingest, health, metrics.
  # Phase 1: port 8090 on 127.0.0.1 only (opencode). Phase 2 will add LAN_IP
  # for Chatbox and the /v1 proxy to llama-server over ai-net.
  # ---------------------------------------------------------------------------
  rag-core:
    build: ./rag-core
    image: rag-core:local
    container_name: rag-core
    restart: unless-stopped
    depends_on:
      embedder:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - rag-net
      - ai-net
      # Reaches Dify's weaviate (service name "weaviate") for the datasets
      # uploaded through the Dify GUI. External: created by the dify stack.
      # After `docker compose down` in the dify repo, run:
      #   docker network connect dify_default rag-core
      - dify_default
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      - EMBEDDER_URL=http://embedder:8081
      - EMBEDDER_MODEL=bge-m3
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY_FILE=/run/secrets/qdrant_api_key
      - RAG_API_KEY_FILE=/run/secrets/rag_api_key
      - COLLECTION=docs
      - EMBED_BATCH=16
      - CHUNK_CHARS=2000
      - STATE_DIR=/state
      - CORPUS_ROOTS=/corpus/ai-compose,/corpus/rag
      # Unified search: Dify datasets (weaviate) + cross-encoder reranking.
      # Empty URL disables the store; search degrades to qdrant-only.
      - WEAVIATE_URL=http://weaviate:8080
      - WEAVIATE_API_KEY_FILE=/run/secrets/weaviate_api_key
      - RERANKER_URL=http://reranker:8091
      - RERANK_API_KEY_FILE=/run/secrets/rerank_api_key
      - QDRANT_CANDIDATES=20
      - WEAVIATE_PER_CLASS=10
      - RERANK_MAX_CANDIDATES=60
    volumes:
      - ./secrets/rag_api_key:/run/secrets/rag_api_key:ro
      - ./secrets/qdrant_api_key:/run/secrets/qdrant_api_key:ro
      - ./secrets/weaviate_api_key:/run/secrets/weaviate_api_key:ro
      - ./secrets/rerank_api_key:/run/secrets/rerank_api_key:ro
      - "${CORPUS_AI_COMPOSE:?set CORPUS_AI_COMPOSE in .env}:/corpus/ai-compose:ro"
      - "${CORPUS_RAG:?set CORPUS_RAG in .env}:/corpus/rag:ro"
      - state:/state
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8090/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # rag-reranker: BAAI/bge-reranker-v2-m3 cross-encoder (CPU) in the /rerank
  # format expected by Dify's OpenAI-API-compatible provider plugin.
  # Sits on rag-net (internal); for Dify it must be connected to the
  # dify_default network with alias "reranker" (same procedure as the
  # embedder - see runbook). Loopback port 8091 for host-side testing.
  # ---------------------------------------------------------------------------
  reranker:
    build: ./reranker
    image: reranker:local
    container_name: rag-reranker
    restart: unless-stopped
    networks:
      - rag-net
      # A container on an internal network alone cannot publish ports
      # (verified 2026-11-20); ai-net also carries the Dify connection
      # procedure's target, so the 127.0.0.1:8091 test port always works.
      - ai-net
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      - MODEL_DIR=/model
      - RERANK_API_KEY_FILE=/run/secrets/rerank_api_key
      - OMP_NUM_THREADS=6
    volumes:
      - ./secrets/rerank_api_key:/run/secrets/rerank_api_key:ro
      - "${RERANK_MODEL_DIR:?set RERANK_MODEL_DIR in .env}:/model:ro"
    # start_period covers the ~1.2 GB model load from the host filesystem.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8091/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging: *default-logging

networks:
  # Internal: no host/internet access for embedder and qdrant.
  rag-net:
    driver: bridge
    internal: true
  # External bridge created once by the main repo (docker network create ai-net).
  # In Phase 1 rag-core sits on it alone; Phase 2 adds the llama alias.
  ai-net:
    external: true
    name: ai-net
  # Created by the dify stack (/mnt/GameLinux/dify). rag-core joins it to
  # search the datasets uploaded through the Dify GUI.
  dify_default:
    external: true
    name: dify_default

volumes:
  qdrant-data:
  state:
